name: Generate Simulation Images

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**/*.py'

jobs:
  generate_plots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib pytest

      - name: Generate Simulation Plots
        run: |
          mkdir -p latex/images
          for script in $(find src -type f -name "*.py" -not -name "__init__.py"); do
            echo "--- Executing ${script} ---"
            python "${script}"
          done

      - name: Commit and Push Updated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latex/images/
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(ci): auto-update simulation plots [skip ci]" && git push)
