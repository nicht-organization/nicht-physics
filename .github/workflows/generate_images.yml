on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**/*.py'          # Reagiert auf JEDE Python-Datei in src/ (auch Unterordner)

      # ... (Setup & Execution Steps)
      - name: Commit and Push Updated Images
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add latex/images/*.png latex/images/*.jpg latex/images/*.svg  # Wildcard für alle Bildformate
          git diff --quiet && git diff --staged --quiet || (git commit -m "build(ci): auto-update simulation plots [skip ci]" && git push)