name: Build LaTeX Documents
on:
  push:
    branches: [ "main", "feature/*", "feat/*" ]
    paths:
      - 'latex/**'             # Reagiert auf alle LaTeX-Dateien, Bibs und Bilder
  workflow_dispatch:
  workflow_run:
    workflows: ["Generate Simulation Images"]
    types: [completed]

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Compile All LaTeX Documents Dynamically
        uses: xu-cheng/latex-action@v4
        with:
          working_directory: latex
          # Nutzt ein Inline-Command, um alle Haupt-TeX-Dateien automatisch zu finden:
          pattern: "*.tex"
          args: "-pdf -bibtex -file-line-error -interaction=nonstopmode"

      - name: Upload PDF Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compiled-Manuscripts
          path: latex/*.pdf